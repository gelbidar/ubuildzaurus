# Static Xorg config for the Akita: fbdev video on /dev/fb0.
# AutoAddGPU/AutoBindGPU OFF: on this DRM-less framebuffer, the modern
# platform-bus GPU auto-binding claims a platform slot (platformSlotClaimed++),
# which makes xf86ClaimFbSlot bail (-1) and the fbdev driver report
# "No devices detected". Disabling it lets fbdev claim the plain fb slot.
# Input is still auto-added via udev/evdev.

Section "ServerFlags"
	Option "AutoAddGPU"  "false"
	Option "AutoBindGPU" "false"
EndSection

Section "Device"
	Identifier "fb"
	Driver     "fbdev"
	Option     "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
	Identifier "monitor"
EndSection

Section "Screen"
	Identifier   "screen"
	Device       "fb"
	Monitor      "monitor"
	DefaultDepth 16
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen     "screen"
EndSection
